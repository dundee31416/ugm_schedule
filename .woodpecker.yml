# CI/CD Pipeline for UGM Schedule
steps:
  - name: build-backend
    image: plugins/docker
    settings:
      repo: ghcr.io/dundee31416/ugm_schedule
      registry: ghcr.io
      dockerfile: backend/Dockerfile
      context: backend
      tags:
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: build-frontend
    image: plugins/docker
    settings:
      repo: ghcr.io/dundee31416/ugm_schedule-frontend
      registry: ghcr.io
      dockerfile: frontend/Dockerfile
      context: frontend
      target: production
      tags:
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: prepare-deploy-dir
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - mkdir -p /mnt/ssd_pool/apps_data/ugm_schedule

  - name: copy-compose
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      source: docker-compose.prod.yml
      target: /tmp
      strip_components: 0

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - mv /tmp/docker-compose.prod.yml /mnt/ssd_pool/apps_data/ugm_schedule/docker-compose.prod.yml
        - cd /mnt/ssd_pool/apps_data/ugm_schedule
        - docker compose -f docker-compose.prod.yml pull
        - docker compose -f docker-compose.prod.yml down
        - docker compose -f docker-compose.prod.yml up -d
