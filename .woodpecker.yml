# CI/CD Pipeline for UGM Schedule
steps:
  - name: build-backend
    image: plugins/docker
    settings:
      repo: ghcr.io/dundee31416/ugm_schedule
      registry: ghcr.io
      dockerfile: backend/Dockerfile
      context: backend
      tags:
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: build-frontend
    image: plugins/docker
    settings:
      repo: ghcr.io/dundee31416/ugm_schedule-frontend
      registry: ghcr.io
      dockerfile: frontend/Dockerfile
      context: frontend
      target: production
      tags:
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      port: 22
      script:
        - cd /mnt/ssd_pool/apps_data_ugm_schedule
        - docker compose pull
        - docker compose down
        - docker compose up -d
