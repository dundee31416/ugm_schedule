steps:
  # Build and push backend image using Kaniko
  build-backend:
    image: gcr.io/kaniko-project/executor:latest
    commands:
      - >
        /kaniko/executor
        --context=/woodpecker/src/github.com/${CI_REPO}/backend
        --dockerfile=Dockerfile
        --destination=ghcr.io/${CI_REPO}:${CI_COMMIT_SHA:0:8}
        --destination=ghcr.io/${CI_REPO}:latest
    environment:
      - DOCKER_AUTH_CONFIG
    secrets:
      - docker_auth_config

  # Build and push frontend image using Kaniko
  build-frontend:
    image: gcr.io/kaniko-project/executor:latest
    commands:
      - >
        /kaniko/executor
        --context=/woodpecker/src/github.com/${CI_REPO}/frontend
        --dockerfile=Dockerfile
        --target=production
        --destination=ghcr.io/${CI_REPO}-frontend:${CI_COMMIT_SHA:0:8}
        --destination=ghcr.io/${CI_REPO}-frontend:latest
    environment:
      - DOCKER_AUTH_CONFIG
    secrets:
      - docker_auth_config
