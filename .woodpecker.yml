steps:
  # Build and push backend image
  build-backend:
    image: plugins/docker
    settings:
      repo: ${CI_REPO}
      registry: ghcr.io
      dockerfile: backend/Dockerfile
      context: backend
      tags:
        - ${CI_COMMIT_SHA:0:8}
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

  # Build and push frontend image
  build-frontend:
    image: plugins/docker
    settings:
      repo: ${CI_REPO}-frontend
      registry: ghcr.io
      dockerfile: frontend/Dockerfile
      context: frontend
      target: production
      tags:
        - ${CI_COMMIT_SHA:0:8}
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

